services:
  backend:
    build: ./backend
    container_name: url-shortener-backend
    restart: unless-stopped
    environment:
      CACHE_ENABLED: "true"
      REDIRECT_STATUS: "302"
      # Now pointing at the shared Postgres on backend-net instead of a
      # dedicated pg container for this app.
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: shortener
      REDISHOST: redis
      PUBLIC_BASE_URL: "https://go.sanattudu.tech"
    # depends_on:
    #   - pg   # no longer needed — postgres now runs in the shared backend-net stack
    networks: [shortener, backend-net]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shortener-backend.rule=Host(`go.sanattudu.tech`)"
      - "traefik.http.routers.shortener-backend.entrypoints=websecure"
      - "traefik.http.routers.shortener-backend.tls=true"
      - "traefik.http.routers.shortener-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.shortener-backend.loadbalancer.server.port=8000"

  frontend:
    build: ./frontend
    container_name: url-shortener-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
    networks: [shortener]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shortener-frontend.rule=Host(`shorten.sanattudu.tech`)"
      - "traefik.http.routers.shortener-frontend.entrypoints=websecure"
      - "traefik.http.routers.shortener-frontend.tls=true"
      - "traefik.http.routers.shortener-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.shortener-frontend.loadbalancer.server.port=3000"

  # for local development or seperate contaioners already running, you can uncomment the following services to run Redis and PostgreSQL containers. Make sure to set the POSTGRES_PASSWORD in your .env file.
  # redis:
  #   image: redis:7-alpine
  #   container_name: url-shortener-redis
  #   restart: unless-stopped
  #   networks: [shortener]

  # pg:
  #   image: postgres:16-alpine
  #   container_name: url-shortener-pg
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: app
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  #     POSTGRES_DB: shortener
  #   volumes:
  #     - ./backend/pg/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #     - pg_data:/var/lib/postgresql/data
  #   networks: [shortener]

networks:
  shortener:
  backend-net:
    external: true

# volumes:
#   pg_data:   # no longer needed, data now lives in the shared postgres_data volume