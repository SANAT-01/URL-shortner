services:
  backend:
    build: ./backend
    container_name: url-shortener-backend
    restart: unless-stopped
    environment:
      CACHE_ENABLED: "true"
      REDIRECT_STATUS: "302"
      PGHOST: pg
      PGUSER: app
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: shortener
      REDISHOST: redis
      PUBLIC_BASE_URL: "https://shorten.sanattudu.tech"
    depends_on:
      - pg
      - redis
    networks: [shortener]

  frontend:
    build: ./frontend
    container_name: url-shortener-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
    networks: [shortener]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shortener.rule=Host(`shorten.sanattudu.tech`)"
      - "traefik.http.routers.shortener.entrypoints=websecure"
      - "traefik.http.routers.shortener.tls=true"
      - "traefik.http.routers.shortener.tls.certresolver=letsencrypt"
      - "traefik.http.services.shortener.loadbalancer.server.port=3000"

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped
    networks: [shortener]

  pg:
    image: postgres:16-alpine
    container_name: url-shortener-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: shortener
    volumes:
      - ./backend/pg/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    networks: [shortener]

networks:
  shortener:

volumes:
  pg_data: