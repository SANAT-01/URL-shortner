# Local dev only — auto-loaded alongside docker-compose.yml by plain
# `docker compose up`. The base file is wired for production (points at a
# shared external Postgres via PGHOST=postgres on the external backend-net
# network, no published ports, no dev admin UIs). This override gives local
# dev its own dedicated pg/redis containers instead, and restores published
# ports + pgAdmin/Redis Insight.
#
# One-time local setup — docker-compose.yml references an external
# `backend-net` network (wherever the shared production Postgres lives).
# Compose merges `networks:` lists rather than letting an override remove
# one, so backend still references backend-net even here. Create an empty
# local stand-in once:
#   docker network create backend-net

services:
  backend:
    ports:
      - "8000:8000"
    environment:
      PUBLIC_BASE_URL: "http://localhost:8000"
      PGHOST: pg
      PGUSER: app
    networks: [shortener]

  frontend:
    ports:
      - "3000:3000"

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks: [shortener]

  pg:
    image: postgres:16-alpine
    container_name: url-shortener-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: shortener
    volumes:
      - ./backend/pg/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    networks: [shortener]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: url-shortener-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - pg
    networks: [shortener]

  redisinsight:
    image: redis/redisinsight:latest
    container_name: url-shortener-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks: [shortener]

volumes:
  pg_data:
